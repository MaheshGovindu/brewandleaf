<div class="full-menu-page">
  <div class="menu-container shadow-lg">
    <!-- Header -->
    <header class="text-center mb-5">
      <div class="logo-wrapper mb-3">
        <img class="brand-logo" src="assets/img/IMG_0069.PNG" alt="">
        <div class="coffee-beans">
          <i class="bi bi-circle-fill bean"></i>
          <i class="bi bi-circle-fill bean"></i>
          <i class="bi bi-circle-fill bean"></i>
        </div>
      </div>
      <div class="menu-title-divider d-flex align-items-center justify-content-center">
        <div class="line"></div>
        <h2 class="menu-main-title mx-4">DRINKS MENU</h2>
        <div class="line"></div>
      </div>
    </header>

    <!-- Drinks Section -->
    <div class="row drinks-grid g-5 mb-5">
      <div class="col-md-6" *ngFor="let group of drinksMenu">
        <div class="menu-group">
          <div class="group-header d-flex align-items-center mb-3">
            <h3 class="group-title">{{ group.name }}</h3>
            <div class="title-accent ms-3"></div>
          </div>
          <div class="menu-items">
            <div class="menu-item d-flex justify-content-between align-items-baseline mb-2" *ngFor="let item of group.products">
              <div class="item-name d-flex align-items-center">
                <i class="bi bi-flower1 me-2 leaf-icon"></i>
                <span>{{ item.name }}</span>
              </div>
              <div class="item-price">₹{{ item.price }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Food Section Header -->
    <div class="menu-title-divider d-flex align-items-center justify-content-center mb-5 mt-5">
      <div class="line"></div>
      <h2 class="menu-main-title mx-4">FOOD MENU</h2>
      <div class="line"></div>
    </div>

    <!-- Food Section -->
    <div class="row food-grid g-4">
      <div class="col-md-4" *ngFor="let group of foodMenu">
        <div class="food-card p-4 h-100">
          <h4 class="food-group-title mb-4 pb-2 border-bottom">{{ group.name }}</h4>
          <div class="food-items">
            <div class="food-item d-flex justify-content-between mb-3" *ngFor="let item of group.products">
              <div class="food-info">
                <div class="d-flex align-items-center mb-1">
                  <i class="bi bi-flower1 me-2 leaf-icon small"></i>
                  <span class="fw-bold">{{ item.name }}</span>
                </div>
                <p class="small text-muted mb-0" *ngIf="item.description">{{ item.description }}</p>
              </div>
              <div class="food-price fw-bold text-nowrap ms-2">₹{{ item.price }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Info -->
    <footer class="mt-5 pt-5 border-top">
      <div class="row align-items-center justify-content-between">
        <div class="col-md-4">
          <div class="d-flex align-items-start">
            <i class="bi bi-geo-alt-fill me-2 mt-1"></i>
            <div>
              <p class="mb-0 fw-bold">Branch:</p>
              <p class="mb-0 text-muted">Oswalwadi, Bhiwandi</p>
            </div>
          </div>
        </div>
        <div class="col-md-4 text-center">
          <div class="footer-decoration">
            <i class="bi bi-flower3 fs-4"></i>
          </div>
        </div>
        <div class="col-md-4 text-end">
          <div class="d-flex align-items-center justify-content-end">
            <i class="bi bi-instagram me-2 fs-5"></i>
            <div>
              <p class="mb-0 fw-bold">Instagram:</p>
              <p class="mb-0 text-muted">&#64;brewndleaf</p>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <div class="text-center mt-4 mb-5">
    <button class="btn btn-dark rounded-pill px-5 py-3 shadow" routerLink="/homepage2">
      <i class="bi bi-arrow-left me-2"></i> BACK TO HOME
    </button>
  </div>
</div>
