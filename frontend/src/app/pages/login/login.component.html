<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <img src="assets/img/IMG_0069.PNG" alt="Brew & Leaf logo">
      <div>
        <h2>Admin Login</h2>
        <p>Sign in to continue to Brew & Leaf admin panel</p>
      </div>
    </div>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" [(ngModel)]="credentials.email" required placeholder="brewandleaf&#64;gmail.com">
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="credentials.password" required placeholder="Enter password">
      </div>
      
      <div class="error-msg" *ngIf="error">{{error}}</div>

      <div class="demo-creds">
        <strong>Demo login</strong>
        <span>Email: brewandleaf&#64;gmail.com</span>
        <span>Password: admin123</span>
      </div>
      
      <button type="submit" class="btn-login" [disabled]="isSubmitting">
        {{isSubmitting ? 'Signing in...' : 'Login'}}
      </button>
    </form>
    
    <div class="back-home">
        <a href="/">Back to Home</a>
    </div>
  </div>
</div>
